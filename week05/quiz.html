<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML and CSS Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <header>
        <h1>Basic HTML and CSS Quiz</h1>
    </header>

    <main>
        <form>
            <!-- Question 1 -->
            <div class="form-item">
                <label for="q1">1. What does the acronym CSS stand for?</label>
                <input type="text" id="q1" name="q1" required>
            </div>

            <!-- Question 2 -->
            <div class="form-item">
                <label for="q2">2. How are id and class attributes selected in CSS?</label>
                <textarea id="q2" name="q2" rows="3" placeholder="Explain briefly..."></textarea>
            </div>

            <!-- Question 3 -->
            <div class="form-item">
                <label for="q3">3. Which of the following is a valid CSS comment?</label>
                <select id="q3" name="q3" required>
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="a">/* This is a comment */</option>
                    <option value="b">// This is a comment</option>
                    <option value="c"><!-- This is a comment --></option>
                </select>
            </div>

            <!-- Question 4 -->
            <div class="form-item">
                <label for="q4">4. What is the bottom margin given this
                    declaration?<br><code>margin: 10px 5px 15px;</code></label>
                <input type="number" id="q4" name="q4" min="0" placeholder="Enter value in px">
            </div>

            <!-- Submit Button -->
            <div class="form-item">
                <button type="submit">Submit Quiz</button>
            </div>
        </form>
    </main>

    <footer>
        <p>&copy;2026 | HTML Form - User Poll Activity | Julius Conteh</p>
    </footer>
</body>

</html>
